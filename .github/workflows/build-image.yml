name: Build web image

# Builds the self-hosted web image (production-stage of the root Dockerfile)
# natively on amd64 runners and publishes it to GHCR, so the small VPS never
# has to build — it just pulls. Triggered on pushes to the deploy branch or
# manually from the Actions tab.
on:
  push:
    branches: [rss-reader-0.11.17]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # foliate-js (and friends) are required by the Docker build context.
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production-stage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/readest-client:latest
            ghcr.io/${{ github.repository_owner }}/readest-client:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_PLATFORM=web
            NEXT_PUBLIC_FRESHRSS_ENABLED=true
          # Link the package to this repo (also drives GHCR's repo-permission
          # inheritance for the GITHUB_TOKEN).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
